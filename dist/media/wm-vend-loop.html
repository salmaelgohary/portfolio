<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wonderMakr xVend loop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #DDDDF6;
  }

  /* ---------- the component ---------- */
  .wm-hero {
    --wm-bg: #DDDDF6;
    --wm-magenta: #D90AF2;
    --wm-gold: #F2B705;
    --wm-navy: #3E428C;
    --wm-dark: #1D2228;
    --wm-tan: #E8C9A0;

    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--wm-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wm-machine {
    position: relative;
    height: 88%;
    aspect-ratio: 296 / 493;
    filter: drop-shadow(0 14px 24px rgba(62, 66, 140, 0.25));
  }
  .wm-machine svg { width: 100%; height: 100%; display: block; }

  .wm-machine .housing-frame { fill: var(--wm-gold); }
  .wm-machine .housing-body  { fill: #d9d9d9; }
  .wm-machine .grid-back     { fill: #1b1e22; stroke: var(--wm-gold); stroke-width: 3; }
  .wm-machine .divider       { stroke: var(--wm-tan); stroke-width: 3.5; stroke-linecap: round; }
  .wm-machine .coil          { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 2.2; }
  .wm-machine .prize         { fill: var(--wm-magenta); }
  .wm-machine .glass         { fill: #ffffff; opacity: 0.07; }
  .wm-machine .tray          { fill: var(--wm-dark); stroke: var(--wm-gold); stroke-width: 2.5; }
  .wm-machine .screen-gold   { fill: var(--wm-gold); }
  .wm-machine .screen-white  { fill: #ffffff; }
  .wm-machine .slot          { fill: #000000; }

  .wm-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .wm-logo {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .wm-logo img {
    width: min(34%, 460px);
    filter: brightness(0) invert(1);
    opacity: 0;
    transform: scale(0.88);
    will-change: transform, opacity;
  }
</style>
</head>
<body>

<div class="wm-hero" id="wmHero">

  <div class="wm-machine">
    <svg viewBox="0 0 296 493" xmlns="http://www.w3.org/2000/svg" aria-label="wonderMakr experiential vending machine">
      <defs>
        <!-- the vended prize is only visible inside the glass and inside the pickup tray -->
        <clipPath id="wmDropClip">
          <rect x="67" y="91" width="158" height="309.5"/>
          <rect x="50" y="431" width="193" height="29"/>
        </clipPath>
      </defs>

      <!-- housing -->
      <rect class="housing-frame" x="0" y="0" width="296" height="493" rx="18"/>
      <rect class="housing-body" x="14" y="14" width="268" height="465" rx="12"/>

      <!-- coil grid (cells are generated below) -->
      <rect class="grid-back" x="65.5" y="89.5" width="161" height="312.5" rx="6"/>
      <g id="wmCells"></g>

      <!-- pickup tray -->
      <rect class="tray" x="48" y="429" width="197" height="33" rx="5"/>

      <!-- the one prize that gets vended -->
      <g clip-path="url(#wmDropClip)">
        <g id="wmVendMove">
          <rect id="wmVendPrize" class="prize" rx="4"/>
        </g>
      </g>

      <g id="wmDividers"></g>
      <polygon class="glass" points="78,95 152,95 118,395 78,395"/>
      <polygon class="glass" points="160,95 178,95 152,395 138,395"/>

      <!-- card-reader screen (blank) -->
      <rect class="screen-gold" x="239" y="187" width="52" height="94" rx="4"/>
      <rect class="screen-white" x="244" y="192" width="42" height="66" rx="2"/>

      <!-- pink scanner under the screen -->
      <rect class="slot" x="255" y="268" width="20" height="7" rx="1"/>
      <rect id="wmSlotInsert" x="257" y="269.3" width="16" height="4.4" rx="1" fill="#D90AF2"/>

      <!-- badge -->
      <g transform="translate(251 140)">
        <g id="wmBadge">
          <rect width="28" height="18" rx="2.5" fill="#3E428C"/>
          <rect x="3" y="3" width="22" height="2" rx="1" fill="#fff"/>
          <circle cx="8" cy="12" r="3.4" fill="#fff"/>
          <rect x="14" y="9" width="10" height="1.6" rx="0.8" fill="#fff"/>
          <rect x="14" y="12.4" width="10" height="1.6" rx="0.8" fill="#fff"/>
        </g>
      </g>
    </svg>
  </div>

  <canvas class="wm-canvas" id="wmCanvas"></canvas>

<script>
(() => {
  /* =========================================================
     Tweak these to change the pacing (all values in ms)
     ========================================================= */
  const TIMING = {
    idle:            1100,  // machine sits stocked before the badge moves
    badgeDown:        600,
    tapHold:          450,  // badge rests on the scanner while it lights up
    badgeUp:          450,
    afterScan:        600,  // pause before the machine vends
    vendDrop:         600,
    afterVend:       1100,  // time to see the prize sitting in the tray
    fill:            3000,  // time to drop the rest of the pile after the first few
    beforeLogo:       250,
    washIn:           450,  // leftover gaps fade to solid pink
    logoIn:           650,
    logoHold:        3400,
    logoOut:          600,
    beforeFade:       150,
    fadeOut:          800,  // solid pink fades back to the machine
    afterFade:        700,
    badgeIn:          400,
  };
  // the first few prizes fall on their own so the "one by one" reads clearly
  const FILL_INTRO  = [260, 210, 170, 140, 115, 95, 80];

  // two layers of falling prizes: a deeper back layer that fills the gaps, and a front layer
  const LAYERS = [
    { size: 128, color: '#B007C8', stroke: 0.16, highlight: 0.05 },
    { size: 104, color: '#D90AF2', stroke: 0.30, highlight: 0.12 },
  ];
  const GRAVITY = 4600;        // px / s^2
  const BACK_BOOST = 1.35;     // back-layer boxes fall this much harder
  let BIN = 8;                 // resolution (px) of the pile's surface (scales with width)
  const BADGE_TRAVEL = 116;    // svg units from rest to the scanner

  const MAGENTA = '#D90AF2';
  const SLOT_FLASH = '#FFB8FF';
  const DEG = Math.PI / 180;

  const hero = document.getElementById('wmHero');
  const canvas = document.getElementById('wmCanvas');
  const ctx = canvas.getContext('2d');
  const logo = document.getElementById('wmLogo');
  const badge = document.getElementById('wmBadge');
  const slotInsert = document.getElementById('wmSlotInsert');
  const vendMove = document.getElementById('wmVendMove');
  const vendPrize = document.getElementById('wmVendPrize');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  /* ---------- build the stocked coil grid ---------- */
  const COLS = 4, ROWS = 6;
  const GX = 65.5, GY = 89.5, GW = 161, GH = 312.5;
  const CW = GW / COLS, CH = GH / ROWS;
  const PW = CW * 0.56, PH = CH * 0.5;
  const VEND = { row: 4, col: 3 };
  const TRAY_PRIZE_Y = 432;

  const cellsG = document.getElementById('wmCells');
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cx = GX + c * CW + CW / 2;
      const cy = GY + r * CH + CH / 2;
      const coil = document.createElementNS(SVG_NS, 'circle');
      coil.setAttribute('class', 'coil');
      coil.setAttribute('cx', cx.toFixed(2));
      coil.setAttribute('cy', cy.toFixed(2));
      coil.setAttribute('r', '9.2');
      cellsG.appendChild(coil);

      const x = cx - PW / 2, y = cy - PH / 2;
      const target = (r === VEND.row && c === VEND.col)
        ? vendPrize
        : cellsG.appendChild(document.createElementNS(SVG_NS, 'rect'));
      target.setAttribute('class', 'prize');
      target.setAttribute('x', x.toFixed(2));
      target.setAttribute('y', y.toFixed(2));
      target.setAttribute('width', PW.toFixed(2));
      target.setAttribute('height', PH.toFixed(2));
      target.setAttribute('rx', '4');
    }
  }
  const vendStartY = GY + VEND.row * CH + CH / 2 - PH / 2;
  const VEND_DY = TRAY_PRIZE_Y - vendStartY;

  const dividersG = document.getElementById('wmDividers');
  for (let r = 1; r < ROWS; r++) {
    const y = GY + r * CH;
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('class', 'divider');
    line.setAttribute('x1', GX + 3);
    line.setAttribute('x2', GX + GW - 3);
    line.setAttribute('y1', y);
    line.setAttribute('y2', y);
    dividersG.appendChild(line);
  }

  /* ---------- small helpers ---------- */
  const setBadge = (y, opacity) => {
    badge.setAttribute('transform', `translate(0 ${y.toFixed(2)})`);
    badge.setAttribute('opacity', opacity.toFixed(3));
  };
  const setVend = (dy) => vendMove.setAttribute('transform', `translate(0 ${dy.toFixed(2)})`);
  const setLogo = (opacity, scale) => {
    logo.style.opacity = opacity.toFixed(3);
    logo.style.transform = `scale(${scale.toFixed(4)})`;
  };
  const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mix = (a, b, t) => {
    const A = hexRgb(a), B = hexRgb(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
  };

  const linear = (t) => t;
  const easeInQuad = (t) => t * t;
  const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
  const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // gaps: an intro of hand-set gaps, then the rest spread over `duration`, getting quicker
  function gapsFor(count, intro, duration) {
    const gaps = intro.slice(0, count);
    const rest = count - gaps.length;
    if (rest <= 0) return gaps;
    const weights = Array.from({ length: rest }, (_, j) => lerp(1.8, 0.35, rest > 1 ? j / (rest - 1) : 1));
    const sum = weights.reduce((a, b) => a + b, 0);
    return gaps.concat(weights.map((w) => (w / sum) * duration));
  }

  /* ---------- clock: everything runs on one frame-driven timeline ---------- */
  let simT = 0;
  const tweens = [], waiters = [], conditions = [];
  const wait = (ms) => new Promise((r) => waiters.push({ t: simT + ms, r }));
  const waitUntilTime = (t) => (simT >= t ? Promise.resolve() : new Promise((r) => waiters.push({ t, r })));
  const until = (pred) => new Promise((r) => conditions.push({ pred, r }));
  const tween = (ms, fn, ease = linear) => new Promise((r) => tweens.push({ t0: simT, ms, fn, ease, r }));

  /* ---------- canvas + pile of prizes ---------- */
  let W = 0, H = 0, dpr = 1, bins = 1;
  let pieces = [];
  let wash = 0;

  function resize() {
    const rect = hero.getBoundingClientRect();
    const sx = W ? rect.width / W : 1, sy = H ? rect.height / H : 1;
    W = rect.width; H = rect.height;
    BIN = Math.max(8, Math.round(W / 170));
    bins = Math.ceil(W / BIN) + 1;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    for (const p of pieces) { p.x *= sx; p.y *= sy; p.target *= sy; }
  }
  new ResizeObserver(resize).observe(hero);
  resize();

  function footprint(p) {
    const a = clamp(Math.floor((p.x + p.w * 0.06) / BIN), 0, bins - 1);
    const z = clamp(Math.floor((p.x + p.w * 0.94) / BIN), 0, bins - 1);
    return [a, z];
  }
  // where the top of a piece ends up if it drops onto `surface` (sinking in a little = overlap)
  function landTop(p, surface) {
    const [a, z] = footprint(p);
    let min = H, max = -Infinity;
    for (let b = a; b <= z; b++) { min = Math.min(min, surface[b]); max = Math.max(max, surface[b]); }
    const floor = H + p.floorSink;
    const bottom = min >= H ? floor : Math.min(floor, min + (max - min) * p.nestle + p.sink);
    return bottom - p.h;
  }
  // tilt a piece toward the lower side of whatever it lands on
  function slopeRot(p, surface) {
    const [a, z] = footprint(p);
    const q = Math.max(1, Math.floor((z - a + 1) / 4));
    let l = 0, r = 0;
    for (let b = a; b < a + q; b++) l += Math.min(surface[b], H);
    for (let b = z - q + 1; b <= z; b++) r += Math.min(surface[b], H);
    const ang = Math.atan2((r - l) / q, p.w) * 0.6;
    return clamp(ang, -14 * DEG, 14 * DEG) + rand(-4, 4) * DEG;
  }
  function stamp(p, top, surface) {
    const [a, z] = footprint(p);
    for (let b = a; b <= z; b++) surface[b] = Math.min(surface[b], top);
  }
  const lowest = (surface) => { let m = -Infinity; for (const v of surface) m = Math.max(m, v); return m; };

  // work out the whole messy pile up front, so we know how many prizes it takes
  function planPile() {
    const surfaces = LAYERS.map(() => new Float32Array(bins).fill(H));
    const plan = [];
    const MAX = Math.min(900, Math.ceil((W * H) / (LAYERS[1].size * LAYERS[1].size) * 3) + 40);
    for (let guard = 0; guard < MAX; guard++) {
      const low = surfaces.map(lowest);
      const open = low.map((v) => v > 2);
      if (!open.includes(true)) break;
      let li;
      if (!open[0]) li = 1;
      else if (!open[1]) li = 0;
      else {
        const behind = low[0] >= low[1] ? 0 : 1;
        li = Math.random() < 0.65 ? behind : 1 - behind;
      }
      const s = surfaces[li];
      const S = LAYERS[li].size;
      const w = S * rand(0.78, 1.08);
      const h = S * rand(0.82, 1.12);
      const m = lowest(s);
      const candidates = [];
      for (let b = 0; b < bins; b++) if (s[b] >= m - 14) candidates.push(b);
      const cx = pick(candidates) * BIN + BIN / 2 + rand(-0.28, 0.28) * w;
      const p = {
        layer: li, w, h,
        x: clamp(cx - w / 2, -w * 0.3, W - w * 0.7),
        sink: h * rand(0.06, 0.16),
        nestle: rand(0.25, 0.45),
        floorSink: rand(0, 8),
        restRot: 0,
        deep: false,
        rot0: rand(-22, 22) * DEG,
        rot: 0, v: 0, y: 0, spawnY: 0, squash: 0,
        resting: false,
      };
      p.restRot = slopeRot(p, s);
      p.target = landTop(p, s);
      stamp(p, p.target, s);
      plan.push(p);
    }
    return plan.concat(planGapFillers(plan));
  }

  // anything still showing through gets a prize dropped in behind the pile
  function planGapFillers(plan) {
    const C = Math.max(10, Math.round(W / 120));
    const gw = Math.ceil(W / C), gh = Math.ceil(H / C);
    const covered = new Uint8Array(gw * gh);
    const mark = (p) => {
      const inset = Math.abs(Math.sin(p.restRot)) * Math.min(p.w, p.h) * 0.5 + 2;
      // a cell counts as covered when its centre sits inside the piece
      const x0 = Math.max(0, Math.ceil((p.x + inset) / C - 0.5));
      const x1 = Math.min(gw - 1, Math.floor((p.x + p.w - inset) / C - 0.5));
      const y0 = Math.max(0, Math.ceil((p.target + inset) / C - 0.5));
      const y1 = Math.min(gh - 1, Math.floor((p.target + p.h - inset) / C - 0.5));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) covered[y * gw + x] = 1;
    };
    plan.forEach(mark);

    const fillers = [];
    // one pass over the remaining open cells, newest coverage respected as we go
    const open = [];
    for (let i = 0; i < covered.length; i++) if (!covered[i]) open.push(i);
    for (let k = open.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [open[k], open[j]] = [open[j], open[k]]; }
    for (const i of open) {
      if (covered[i]) continue;
      const cx = (i % gw) * C + C / 2, cy = Math.floor(i / gw) * C + C / 2;
      const S = LAYERS[0].size * rand(0.9, 1.15);
      const w = S * rand(0.85, 1.05), h = S * rand(0.85, 1.05);
      const p = {
        layer: 0, deep: true, w, h,
        x: cx - w / 2 + rand(-0.2, 0.2) * w,
        sink: h * rand(0.06, 0.16), nestle: rand(0.35, 0.6), floorSink: rand(0, 8),
        restRot: rand(-8, 8) * DEG,
        rot0: rand(-22, 22) * DEG,
        rot: 0, v: 0, y: 0, spawnY: 0, squash: 0,
        resting: false,
      };
      p.target = Math.min(cy - h / 2 + rand(-0.2, 0.2) * h, H + p.floorSink - h);
      mark(p);
      fillers.push(p);
      if (fillers.length > 260) break;
    }
    return fillers;
  }

  function launch(p) {
    p.y = Math.min(-p.h - rand(10, 50), p.target - 60);
    p.spawnY = p.y;
    p.g = p.layer === 0 ? GRAVITY * BACK_BOOST : GRAVITY;
    p.v = p.layer === 0 ? rand(420, 560) : rand(260, 380);
    pieces.push(p);
  }

  function physics(dt) {
    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.squash = Math.max(0, p.squash - dt * 6);
      if (p.resting) continue;

      p.v += (p.g || GRAVITY) * dt;
      p.y += p.v * dt;

      const travel = p.target - p.spawnY;
      const left = travel > 0 ? clamp((p.target - p.y) / travel, 0, 1) : 0;
      p.rot = p.restRot + (p.rot0 - p.restRot) * left * (p.spawnY < 0 ? 1 : 0);

      if (p.y >= p.target) {
        p.y = p.target;
        p.rot = p.restRot;
        if (p.v > 520) {
          p.v = -p.v * 0.18;
          p.squash = 1;
        } else {
          p.v = 0;
          p.resting = true;
        }
      }
    }
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPiece(p, cfg, detail, fill) {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(p.rot);
    ctx.scale(1 + 0.05 * p.squash, 1 - 0.08 * p.squash);
    const r = Math.min(p.w, p.h) * 0.12;
    roundRectPath(-p.w / 2, -p.h / 2, p.w, p.h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    if (detail > 0.01) {
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = `rgba(255,255,255,${cfg.stroke * detail})`;
      ctx.stroke();
      // lid highlight: rounded top corners, square bottom
      const x = -p.w / 2, y = -p.h / 2, hh = p.h * 0.2;
      ctx.beginPath();
      ctx.moveTo(x, y + hh);
      ctx.arcTo(x, y, x + p.w, y, r);
      ctx.arcTo(x + p.w, y, x + p.w, y + hh, r);
      ctx.lineTo(x + p.w, y + hh);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,255,255,${cfg.highlight * detail})`;
      ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (wash > 0) {
      ctx.globalAlpha = wash;
      ctx.fillStyle = MAGENTA;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    const detail = 1 - wash;
    const back = LAYERS[0], front = LAYERS[1];
    const backFill = wash > 0 ? mix(back.color, MAGENTA, wash) : back.color;
    const frontFill = wash > 0 ? mix(front.color, MAGENTA, wash) : front.color;
    for (const p of pieces) if (p.deep) drawPiece(p, back, detail, backFill);
    for (const p of pieces) if (p.layer === 0 && !p.deep) drawPiece(p, back, detail, backFill);
    for (const p of pieces) if (p.layer === 1) drawPiece(p, front, detail, frontFill);
  }

  /* ---------- sequence ---------- */
  async function scanBadge() {
    await tween(TIMING.badgeDown, (p) => setBadge(p * BADGE_TRAVEL, 1), easeInOutCubic);
    await tween(TIMING.tapHold, (p) => slotInsert.setAttribute('fill', mix(MAGENTA, SLOT_FLASH, Math.sin(Math.PI * p))));
    slotInsert.setAttribute('fill', MAGENTA);
    await tween(TIMING.badgeUp, (p) => setBadge((1 - p) * BADGE_TRAVEL, 1 - p), easeInOutCubic);
  }

  async function vend() {
    await tween(TIMING.vendDrop, (p) => setVend(p * VEND_DY), easeInQuad);
    await tween(220, (p) => setVend(VEND_DY - 5 * Math.sin(Math.PI * p)));
    setVend(VEND_DY);
  }

  async function fillPage() {
    pieces = [];
    const plan = planPile();
    const gaps = gapsFor(plan.length, FILL_INTRO, TIMING.fill);
    // schedule on absolute time so several prizes can leave in one frame when they're close together
    let due = simT;
    for (let k = 0; k < plan.length; k++) {
      if (simT < due) await waitUntilTime(due);
      launch(plan[k]);
      due += gaps[k];
    }
    await until(() => pieces.every((p) => p.resting));
  }

  function resetMachine() {
    setVend(0);
    setBadge(0, 0);
    slotInsert.setAttribute('fill', MAGENTA);
  }

  async function loop() {
    setBadge(0, 1);
    for (;;) {
      await wait(TIMING.idle);
      await scanBadge();
      await wait(TIMING.afterScan);
      await vend();
      await wait(TIMING.afterVend);

      await fillPage();
      await wait(TIMING.beforeLogo);
      await tween(TIMING.washIn, (p) => { wash = p; });
      resetMachine(); // hidden behind the pink

      await tween(TIMING.logoIn, (p) => setLogo(p, 0.88 + 0.12 * easeOutBack(p)));
      await wait(TIMING.logoHold);
      await tween(TIMING.logoOut, (p) => setLogo(1 - p, 1 - 0.06 * p), easeInQuad);

      await wait(TIMING.beforeFade);
      await tween(TIMING.fadeOut, (p) => { canvas.style.opacity = (1 - p).toFixed(3); }, easeInOutCubic);
      pieces = [];
      wash = 0;
      draw();
      canvas.style.opacity = '1';

      await wait(TIMING.afterFade);
      await tween(TIMING.badgeIn, (p) => setBadge(0, p), easeOutQuad);
    }
  }

  let last = performance.now();
  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    simT += dt * 1000;

    for (const tw of tweens.slice()) {
      const p = tw.ms <= 0 ? 1 : Math.min(1, (simT - tw.t0) / tw.ms);
      tw.fn(tw.ease(p));
      if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.r(); }
    }

    physics(dt);
    draw();

    for (const w of waiters.slice()) {
      if (simT >= w.t) { waiters.splice(waiters.indexOf(w), 1); w.r(); }
    }
    for (const c of conditions.slice()) {
      if (c.pred()) { conditions.splice(conditions.indexOf(c), 1); c.r(); }
    }
    if (running) requestAnimationFrame(frame);
  }

  /* ---------- only animate while the frame is actually on screen ---------- */
  let running = false, started = false;
  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
    if (!started) { started = true; loop(); }
  }
  function stop() { running = false; }

  setBadge(0, 1);
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const host = window.frameElement;
    let gated = false;
    try {
      if (host && window.parent.IntersectionObserver) {
        new window.parent.IntersectionObserver(
          (entries) => { entries[entries.length - 1].isIntersecting ? start() : stop(); },
          { rootMargin: '150px' }
        ).observe(host);
        gated = true;
      }
    } catch (e) {}
    if (!gated) start();
  }
})();
</script>
</body>
</html>
